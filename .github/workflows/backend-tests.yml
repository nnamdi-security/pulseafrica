name: Backend tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pulseafrica
          POSTGRES_PASSWORD: pulseafrica
          POSTGRES_DB: pulseafrica_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pulseafrica -d pulseafrica_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests (SQLite)
        run: pytest

      - name: Run tests (Postgres 16)
        env:
          TEST_DATABASE_URL: postgresql+psycopg://pulseafrica:pulseafrica@localhost:5432/pulseafrica_test
        run: pytest
