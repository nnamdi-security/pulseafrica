name: Smoke test

# Read-only checks against a deployed site, run by hand after each deploy (Milestone 9, D72).
# The account is a citizen kept for this test: repository secrets SMOKE_EMAIL and SMOKE_PASSWORD.
on:
  workflow_dispatch:
    inputs:
      url:
        description: The deployed site's https address
        required: true

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smoke
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: e2e/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r ../e2e/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run the smoke test
        env:
          SMOKE_URL: ${{ inputs.url }}
          SMOKE_EMAIL: ${{ secrets.SMOKE_EMAIL }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
        run: pytest --tracing retain-on-failure --output test-results

      - name: Keep traces of failed checks
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-traces
          path: smoke/test-results
