# Render Blueprint for PulseAfrica's first deployment (docs/DEPLOYMENT.md, decision 0028).
#
#   web  pulseafrica-web  Next.js (frontend/), the only public service; /api/* is proxied to the API
#   pserv pulseafrica-api FastAPI (backend/Dockerfile), reachable only on Render's private network
#   db   pulseafrica-db   PostgreSQL 16, no public access
#
# Nothing secret is written here: JWT_SECRET_KEY is generated by Render, and DATABASE_URL comes
# from the database. Render checks this file when the Blueprint is created; plan names and
# regions follow its current list (D61: paid, always-on tiers).
services:
  - type: pserv
    name: pulseafrica-api
    runtime: docker
    region: frankfurt
    plan: starter
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    # Migrations run once per deploy, before the new instance starts (never on boot)
    preDeployCommand: alembic upgrade head
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - backend/**
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pulseafrica-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: RATE_LIMITING
        value: "true"
      # Same origin through Next.js, so no browser calls the API across origins
      - key: CORS_ORIGINS
        value: ""
      # Render's private network (the Next.js service's address changes on each deploy), then
      # Cloudflare, which sits in front of Render and appends its own edge address to
      # X-Forwarded-For. Cloudflare's published ranges: https://www.cloudflare.com/ips/
      - key: TRUSTED_PROXIES
        value: 10.0.0.0/8,173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22,2400:cb00::/32,2606:4700::/32,2803:f800::/32,2405:b500::/32,2405:8100::/32,2a06:98c0::/29,2c0f:f248::/32
      - key: PORT
        value: "8000"

  - type: web
    name: pulseafrica-web
    runtime: node
    region: frankfurt
    plan: starter
    rootDir: frontend
    # API_INTERNAL_URL is read at build time by the /api rewrite and at run time by the
    # server-rendered pages, so it's set from the API's private address before both.
    buildCommand: >-
      corepack enable &&
      export API_INTERNAL_URL="http://$API_HOSTPORT/api" &&
      pnpm install --frozen-lockfile &&
      pnpm build
    startCommand: API_INTERNAL_URL="http://$API_HOSTPORT/api" pnpm start -H 0.0.0.0 -p $PORT
    healthCheckPath: /api/health/ready
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - frontend/**
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: API_HOSTPORT
        fromService:
          type: pserv
          name: pulseafrica-api
          property: hostport
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      # The first deployment is a labelled demonstration (D63): a notice on every page
      - key: DEMO_SITE
        value: "true"

databases:
  - name: pulseafrica-db
    databaseName: pulseafrica
    user: pulseafrica
    region: frankfurt
    plan: basic-256mb
    postgresMajorVersion: "16"
    # No outside connections; only services on the private network
    ipAllowList: []
